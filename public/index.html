<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="color-scheme" content="light dark">
    <meta name="theme-color" content="#8b5cf6">
    <title>Dog vs Cat Voting</title>
    
    <!-- Google Fonts: Sora + Nunito Sans -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Nunito+Sans:wght@400;600&family=Sora:wght@500;600;700&display=swap" rel="stylesheet">
    
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="container">
        <header class="header">
            <h1 class="title">Dog vs Cat</h1>
            <p class="subtitle">Vote for your favorite!</p>
        </header>
        
        <main class="main">
            <div class="cards">
                <div class="card" id="dog-card">
                    <div class="card-label">Dog</div>
                    <div class="image-container">
                        <img id="dog-image" src="" alt="Random Dog" loading="lazy">
                        <div class="spinner" id="dog-spinner">
                            <div class="spinner-ring"></div>
                        </div>
                    </div>
                    <button class="vote-btn dog-btn" onclick="vote('dog')" aria-label="Vote for Dog">
                        Vote Dog
                    </button>
                </div>
                
                <div class="card" id="cat-card">
                    <div class="card-label">Cat</div>
                    <div class="image-container">
                        <img id="cat-image" src="" alt="Random Cat" loading="lazy">
                        <div class="spinner" id="cat-spinner">
                            <div class="spinner-ring"></div>
                        </div>
                    </div>
                    <button class="vote-btn cat-btn" onclick="vote('cat')" aria-label="Vote for Cat">
                        Vote Cat
                    </button>
                </div>
            </div>
            
            <div class="stats">
                <div class="vote-counter">
                    <span class="vote-count dog-count" id="dog-votes">0</span>
                    <span class="vs">vs</span>
                    <span class="vote-count cat-count" id="cat-votes">0</span>
                </div>
                <div class="total">
                    Total votes: <span id="total-votes">0</span>
                </div>
            </div>
            
            <button class="refresh-btn" onclick="refreshImages()" aria-label="Load new random images">
                Load New Images
            </button>
        </main>
    </div>
    
    <script src="app.js"></script>
</body>
</html>
